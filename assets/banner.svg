<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .panelFill   { fill: #ffffff; fill-opacity: 0.08; }
      .panelStroke { stroke: #ffffff; stroke-opacity: 0.16; }
      .catchLight  { stroke: #ffffff; stroke-opacity: 0.22; }
      .titleText   { fill: #f1efe9; }
      .subText     { fill: #c7c2b8; }
      .metaText    { fill: #948f83; }
      .grain       { opacity: 0.02; }
      .shimmerStop { stop-color: #ffffff; }

      @media (prefers-color-scheme: light) {
        .panelFill   { fill: #000000; fill-opacity: 0.045; }
        .panelStroke { stroke: #000000; stroke-opacity: 0.22; }
        .catchLight  { stroke: #000000; stroke-opacity: 0.12; }
        .titleText   { fill: #201f1c; }
        .subText     { fill: #4c473e; }
        .metaText    { fill: #7a756a; }
        .grain       { opacity: 0.012; }
        .shimmerStop { stop-color: #000000; }
      }
    </style>

    <filter id="heavyBlurHub" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softBlurHub" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <clipPath id="panelClipHub">
      <rect x="70" y="56" width="1060" height="220" rx="24"/>
    </clipPath>

    <linearGradient id="shimmerGradHub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="shimmerStop" offset="0%" stop-opacity="0"/>
      <stop class="shimmerStop" offset="50%" stop-opacity="0.14"/>
      <stop class="shimmerStop" offset="100%" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="spectrumBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#3f6ed9"/>
      <stop offset="12%" stop-color="#d98e3f"/>
      <stop offset="30%" stop-color="#2fbf8e"/>
      <stop offset="42%" stop-color="#8f5fe0"/>
      <stop offset="58%" stop-color="#e0566b"/>
      <stop offset="70%" stop-color="#4fb3d9"/>
      <stop offset="82%" stop-color="#e05f9f"/>
      <stop offset="90%" stop-color="#5fd9a8"/>
      <stop offset="95%" stop-color="#d9973f"/>
      <stop offset="100%" stop-color="#3fc9c0"/>
    </linearGradient>

    <filter id="grainFilterHub">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 0 0.5
                0 0 0 0.06 0"/>
    </filter>
  </defs>

  <circle fill="#3f6ed9" opacity="0.22" cx="150" cy="90" r="150" filter="url(#heavyBlurHub)"/>
  <circle fill="#8f5fe0" opacity="0.20" cx="480" cy="260" r="150" filter="url(#heavyBlurHub)"/>
  <circle fill="#e0566b" opacity="0.18" cx="760" cy="70" r="150" filter="url(#heavyBlurHub)"/>
  <circle fill="#e05f9f" opacity="0.18" cx="980" cy="250" r="150" filter="url(#heavyBlurHub)"/>
  <circle fill="#3fc9c0" opacity="0.20" cx="1080" cy="90" r="140" filter="url(#heavyBlurHub)"/>

  <rect class="panelFill panelStroke" x="70" y="56" width="1060" height="220" rx="24" stroke-width="1.4"/>

  <g clip-path="url(#panelClipHub)">
    <rect class="grain" x="70" y="56" width="1060" height="220" filter="url(#grainFilterHub)"/>
  </g>

  <path class="catchLight" d="M 86 57 H 1114" stroke-width="1" filter="url(#softBlurHub)"/>

  <g clip-path="url(#panelClipHub)">
    <g transform="skewX(-20)">
      <rect x="-260" y="20" width="70" height="280" fill="url(#shimmerGradHub)">
        <animateTransform attributeName="transform" type="translate"
                           from="0 0" to="1500 0"
                           begin="0.4s" dur="2.6s"
                           calcMode="spline" keySplines="0.25 0.1 0.25 1"
                           fill="freeze"/>
      </rect>
    </g>
  </g>

  <text class="titleText" x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="600" letter-spacing="0.5">
    AI/ML Internship — The Full Journey
  </text>

  <text class="subText" x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15">
    Eight weeks, five repositories, one continuous line of decisions.
  </text>

  <rect x="450" y="212" width="300" height="6" rx="3" fill="url(#spectrumBar)"/>

  <text class="metaText" x="600" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="0.5">
    student-management-system · eda-data-pipeline · classical-ml-comparison · capstone-ai-modules · capstone-backend
  </text>
</svg>
